# Local production-like stack: API (serving the web build) + MySQL 8.
# Sign-in is e-mail + password only — this stack has no Clerk.
#   docker compose up --build
# Then open http://localhost:4000. Seed sample data once with:
#   docker compose exec api node dist/scripts/seed.js
# First administrator (if you skipped the sample seed):
#   docker compose exec api node dist/scripts/seed-admin.js
#   sign in: admin@qac.poolreno.com / Admin1234!
#
# PostgreSQL instead of MySQL:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# Secrets below are placeholders for local use only. In a real deployment set
# SESSION_SECURE=true, an https APP_URL and strong passwords (docs/DEPLOYMENT.md).

services:
  api:
    build:
      context: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # Plain http on localhost is rejected by the production config checks; override
      # these two with your public https origin for a real deployment.
      APP_URL: ${APP_URL:-http://localhost:4000}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOW_INSECURE_PRODUCTION: ${ALLOW_INSECURE_PRODUCTION:-true}
      AUTH_PROVIDER: session
      DB_CLIENT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: scope
      DB_PASSWORD: ${DB_PASSWORD:-scope-local-only}
      DB_DATABASE: scope_checklist
      TRUST_PROXY: 1
      EXPORT_TIMEZONE: Asia/Manila
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: scope_checklist
      MYSQL_USER: scope
      MYSQL_PASSWORD: ${DB_PASSWORD:-scope-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uscope", "-p${DB_PASSWORD:-scope-local-only}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
