# nginx server block for https://qac.poolreno.com
#   sudo cp nginx.conf /etc/nginx/sites-available/qac.poolreno.com
#   sudo ln -s /etc/nginx/sites-available/qac.poolreno.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d qac.poolreno.com      # issues the certificate and fills the ssl_* lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS terminates here; the application container listens on 127.0.0.1:4000 and relies on
# X-Forwarded-Proto / X-Forwarded-For (TRUST_PROXY=1) for the Secure cookie and rate limits.

server {
    listen 80;
    listen [::]:80;
    server_name qac.poolreno.com;

    # ACME challenges stay on http; everything else goes to https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qac.poolreno.com;

    # Written by certbot; adjust if the certificate lives elsewhere.
    ssl_certificate     /etc/letsencrypt/live/qac.poolreno.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qac.poolreno.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;            # API JSON bodies are capped at 256 kB anyway

    access_log /var/log/nginx/qac.poolreno.com.access.log;
    error_log  /var/log/nginx/qac.poolreno.com.error.log;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
