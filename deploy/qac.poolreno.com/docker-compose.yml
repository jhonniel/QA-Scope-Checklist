# Production stack for https://qac.poolreno.com — the application image (API serving the
# built web app) + PostgreSQL 16, behind the nginx server block in nginx.conf.
#
#   cd deploy/qac.poolreno.com
#   cp api.env.example api.env            # fill in DB_PASSWORD
#   docker compose --env-file api.env up -d --build
#
# --env-file api.env makes the values available for ${…} substitution (DB password for
# postgres); env_file hands the same file to the API as its environment.
# The API binds to 127.0.0.1 only — nginx terminates TLS and proxies to it. PostgreSQL is
# not published at all. See README.md next to this file for the full runbook.

name: scope-checklist-qac

services:
  api:
    build:
      context: ../..
    image: scope-checklist:qac
    env_file: api.env
    environment:
      # Guard rails that must not be changed by the env file.
      NODE_ENV: production
      WEB_DIST: /app/apps/web/dist
      AUTH_PROVIDER: session
      DB_CLIENT: postgres
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-scope_checklist}
      POSTGRES_USER: ${DB_USER:-scope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api.env}
      # The application user owns the database, so it has CREATE on the public schema (PostgreSQL 15+).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scope} -d ${DB_DATABASE:-scope_checklist}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres-data:
