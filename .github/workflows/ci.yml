name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
        env:
          NODE_ENV: test

      - run: npm run build

      - name: Boot the production bundle
        run: |
          set -e
          node apps/api/dist/server.js &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:4000/projects | grep -q 200
          kill -TERM $PID
          wait $PID
        working-directory: apps/api
        env:
          NODE_ENV: development
          DB_FILE: ":memory:"
          WEB_DIST: ../web/dist
          LOG_REQUESTS: "false"

      - name: Production config gate refuses unsafe settings
        # The server must exit non-zero (and say why) on plain-http, development Clerk keys and a throwaway database.
        run: |
          set +e
          OUT=$(node dist/server.js 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          test "$CODE" -ne 0
          echo "$OUT" | grep -q "APP_URL must be an https"
          echo "$OUT" | grep -q "development keys"
        working-directory: apps/api
        env:
          NODE_ENV: production
          APP_URL: http://localhost:4000
          DB_CLIENT: sqlite
          DB_FILE: ":memory:"
          AUTH_PROVIDER: clerk
          CLERK_PUBLISHABLE_KEY: pk_test_Y29udGVudC1leGFtcGxlLmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_placeholder_not_a_real_key

  api-postgres:
    name: API tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scope
          POSTGRES_PASSWORD: scope
          POSTGRES_DB: scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope -d scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same feature suite as the SQLite run, each test server in its own schema.
      - run: npm test -w @scope/api
        env:
          NODE_ENV: test
          TEST_DB_CLIENT: postgres
          TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test

      - name: Migrate, seed and boot against PostgreSQL
        run: |
          set -e
          npx tsx src/scripts/fresh.ts
          npx tsx src/scripts/migrate.ts | grep -q "already up to date 7 (postgres)"
          node --import tsx src/server.ts &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/health | grep -q '"db":"ok"'
          kill -TERM $PID
          wait $PID
        working-directory: apps/api
        env:
          NODE_ENV: development
          DB_CLIENT: postgres
          DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
          LOG_REQUESTS: "false"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
